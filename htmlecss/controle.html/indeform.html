<form action="#" method="post">
    <label for="porteiroAutorizou">Porteiro responsável pelo registro:</label>
    <input type="text" id="porteiroAutorizou" name="Porteiro responsável pelo registro" required>

    <label for="nomeCompleto">Nome Completo:</label>
    <input type="text" id="nomeCompleto" name="Nome Completo" required>

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf" required>

    <label for="dataNascimento">Data de Nascimento:</label>
    <input type="date" id="dataNascimento" name="Data de Nascimento" required>

    <label for="numeroCasa">Número da casa a ser visitada:</label>
    <input type="text" id="numeroCasa" name="Número da casa a ser visitada" required>

    <label for="placaVeiculo">Placa do Veículo:</label>
    <input type="text" id="placaVeiculo" name="Placa do Veículo" required>

    <label for="horaSaida">Horário de saída do condomínio:</label>
    <input type="time" id="horaSaida" name="Horário de saída do condomínio" required>

    <label for="horaAutorizacao">Horário de Autorização de Entrada:</label>
    <input type="time" id="horaAutorizacao" name="Horário de Autorização de Entrada" required>

    <label for="nomeMorador">Nome do morador responsável por autorizar a entrada:</label>
    <input type="text" id="nomeMorador" name="Nome do morador responsável por autorizar a entrada" required>

    <input type="submit" value="Enviar">
</form>
