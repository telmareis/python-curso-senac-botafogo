<!DOCTYPE html>

{% load static %}

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Visitantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c7ede4;
        }

        form {
            max-width: 500px;
            margin: auto;
            padding: 15px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #d6e2eee8;
        }

        label {
            display: block;
            margin-bottom: 1px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            margin-left: -10px;
            border: 1px solid black;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #087ef431;
            color: black;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    
    <h2>Registro de Visitantes</h2>
    
    <main>
        <a href="index.html">Voltar para página inicial</a>
    </main>
    
    {{ form }}
    
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>
</body>
</html>
