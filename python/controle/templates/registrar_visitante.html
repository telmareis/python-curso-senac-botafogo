<!DOCTYPE html>

{% load static %}

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Visitantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c7ede4;
        }

        form {
            max-width: 500px;
            margin: auto;
            padding: 15px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #d6e2eee8;
        }

        label {
            display: block;
            margin-bottom: 1px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            margin-left: -10px;
            border: 1px solid black;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #087ef431;
            color: black;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Registro de Visitantes</h2>

    <p class="mb-5 ml=1">
        <small>
            (*) Campo obrigatório
        </small>
    </p>
    <main>
        <a href="index.html">Voltar para página inicial</a>
    </main>

    <form action="#" method="post">

        <div class="form-row">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group col-md-12">
                    <label>{{ field.label }}</label>
                    {% if field.field.required %} * {% endif %}
                    {% render_field field placeholder=field.label class="form-control" %}
    
                </div>
            {% endfor %}
        </div>

        <div class="text-right">
            <button class="btn btn-primary" type="submit">
                <span class="text">Registrar Visitante</span>
            </button>
        </div>

        <label for="porteiroAutorizou">Porteiro responsável pelo registro:</label>
        <input type="text" id="porteiroAutorizou" name="Porteiro responsável pelo registro" required>

        <label for="nomeCompleto">Nome Completo:</label>
        <input type="text" id="nomeCompleto" name="Nome Completo" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required>

        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="dataNascimento" name="Data de Nascimento" required>

        <label for="numeroCasa">Número da casa a ser visitada:</label>
        <input type="text" id="numeroCasa" name="Número da casa a ser visitada" required>

        <label for="placaVeiculo">Placa do Veículo:</label>
        <input type="text" id="placaVeiculo" name="Placa do Veículo" required>

        <label for="horaSaida">Horário de saída do condomínio:</label>
        <input type="time" id="horaSaida" name="Horário de saída do condomínio" required>

        <label for="horaAutorizacao">Horário de Autorização de Entrada:</label>
        <input type="time" id="horaAutorizacao" name="Horário de Autorização de Entrada" required>

        <label for="nomeMorador">Nome do morador responsável por autorizar a entrada:</label>
        <input type="text" id="nomeMorador" name="Nome do morador responsável por autorizar a entrada" required>

        <input type="submit" value="Enviar">
    </form>

    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>
</body>

</html>
