<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Visitantes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #087ef431;
        }

        form {
            max-width: 500px;
            margin: auto;
            padding: 15px;
            border: 1px solid black;
            border-radius: 10px;
            background-color: #c7ede4;
        }

        label {
            display: block;
            margin-bottom: 1px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            margin-left: -10px;
            border: 1px solid black;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #087ef431;
            color: black;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Registro de Visitantes</h2>
    <main>
        <a href="index.html">Voltar para página inicial</a>
    </main>
    <form action="#" method="post">
        <label for="nomeCompleto">Nome Completo:</label>
        <input type="text" id="nomeCompleto" name="Nome Completo" required>

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" required>

        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="dataNascimento" name="Data de Nascimento" required>

        <label for="numeroCasa">Número da Casa:</label>
        <input type="text" id="numeroCasa" name="Número da casa a ser visitada" required>

        <label for="placaVeiculo">Placa do Veículo:</label>
        <input type="text" id="placaVeiculo" name="Placa do Veículo" required>

        <label for="horaChegada">Hora da Chegada:</label>
        <input type="time" id="horaChegada" name="Hora da chegada" required>

        <label for="horaSaida">Hora da Saída:</label>
        <input type="time" id="horaSaida" name="Hora de saída co condomínio" required>

        <label for="horaAutorizacao">Hora da Autorização:</label>
        <input type="time" id="horaAutorizacao" name="Hora da Autorização" required>

        <label for="nomeMorador">Nome do Morador:</label>
        <input type="text" id="nomeMorador" name="Nome do morador" required>

        <label for="porteiroAutorizou">Porteiro que Autorizou:</label>
        <input type="text" id="porteiroAutorizou" name="Horário de Autorização de Entrada" required>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
